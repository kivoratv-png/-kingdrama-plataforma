# Configuração usada quando o deploy vem do GitHub.
#
# A Netlify lê este arquivo na raiz do repositório e já sabe o que fazer:
# não há etapa de build (o site é estático) e a pasta publicada é public/.
# Com isso, ao conectar o repositório não é preciso preencher nada no painel.
#
# Existe um segundo netlify.toml dentro de public/ — aquele serve para quando o
# site é enviado como zip (ali a pasta publicada é a própria raiz do zip).
# A Netlify ignora o de dentro da pasta publicada, então os dois convivem.

[build]
  publish = "public"
  functions = "netlify/functions"
  # Vazio de propósito, e precisa continuar vazio. Preencher aqui faz a
  # publicação virar um build de verdade, e a conta Free não tem crédito para
  # isso: o deploy falha com "Skipped due to account credit usage exceeded"
  # (aconteceu ao tentar gerar o versao.json por aqui). Sem command, publicar
  # é só o envio dos arquivos e não consome crédito nenhum.
  # O config/versao.json é gerado antes do commit, por scripts/gera-versao.js.
  command = ""

[build.environment]
  NODE_VERSION = "22"

# As rotas da SPA e os cabeçalhos de segurança continuam vindo de
# public/_redirects e public/_headers, que valem nos dois modos de deploy.
