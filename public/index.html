<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0606">
  <meta name="color-scheme" content="dark">
  <meta name="kingdrama-version" content="7e9548d5f437">
  <title>KingDrama</title>
  <meta name="description" content="KingDrama — dramas e séries para assistir no celular, tablet e computador.">
  <link rel="icon" href="/img/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta property="og:title" content="KingDrama">
  <meta property="og:description" content="Dramas e séries para assistir onde você estiver.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="/img/icon-512.png">
  <!-- Este index serve todas as rotas, então o que vier aqui é baixado também
       por quem cai na tela de visitante. O preload do banner-1 (184 KB) ficava
       de fora do que essa tela usa: era metade do peso da porta de entrada,
       logo onde o visitante decide se fica. O banner segue priorizado onde de
       fato aparece, pelo fetchpriority="high" do primeiro slide da home.
       Já a configuração dos banners é lida em toda página, e sem este preload
       ela só começava a ser buscada depois de todo o JS rodar. -->
  <link rel="preload" as="fetch" href="/config/banners.json" crossorigin>
  <link rel="stylesheet" href="/css/app.css?v=7e9548d5f437">
  <link rel="stylesheet" href="/css/admin.css?v=7e9548d5f437">
  <!-- Abre DNS + TLS com o Supabase já no começo do carregamento. Sem isto, a
       primeira consulta paga esse aperto de mão antes de sequer pedir os dados
       (uns 150-250ms em 4G). O crossorigin é obrigatório: as chamadas são
       fetch com CORS, e sem ele o navegador abriria uma segunda conexão. -->
  <link rel="preconnect" href="https://yvwdhuphzyjfhfsqdeho.supabase.co" crossorigin>
  <!-- Camada de dados: Supabase. O SDK é servido pelo próprio site porque o
       CSP só permite scripts de 'self'. -->
  <script src="/vendor/supabase.js?v=7e9548d5f437"></script>
  <script src="/js/config.js?v=7e9548d5f437"></script>
  <script src="/js/data-supabase.js?v=7e9548d5f437"></script>
  <script type="module" src="/js/app.js?v=7e9548d5f437"></script>
  <!-- app.js importa estes três. Sem avisar aqui, o navegador só descobre que
       precisa deles depois de baixar e interpretar o app.js — um degrau extra
       na escada. Declarados, os quatro descem juntos. -->
  <link rel="modulepreload" href="/js/lib.js?v=7e9548d5f437">
  <link rel="modulepreload" href="/js/pages.js?v=7e9548d5f437">
  <link rel="modulepreload" href="/js/auth-pages.js?v=7e9548d5f437">
</head>
<body>
  <a class="skip-link" href="#main">Pular para o conteúdo</a>
  <div id="app">
    <div class="boot"><img class="boot-logo" src="/img/logo.png" alt="KingDrama" width="300" height="100"></div>
  </div>
  <noscript><p style="padding:24px;color:#fff">Ative o JavaScript para usar o KingDrama.</p></noscript>
</body>
</html>
